name: Luminal
description: >-
  Luminal is an AI inference-optimization company that compiles machine-learning
  models ahead-of-time into optimized native code for GPUs and ASICs, aiming to
  deliver the fastest, highest-throughput inference available. Its core product
  is an open-source, high-performance general-purpose inference compiler written
  in Rust (the "luminal" crate), built around static computation graphs, a
  compile-time-checked GraphTensor API, composable neural-network modules, and
  pluggable graph compilers. Luminal ships two deployment paths: Luminal Cloud, a
  managed serverless inference service with automatic scaling, and licensed
  on-prem deployment with dedicated support and custom optimization. The company
  is backed by Felicis.
